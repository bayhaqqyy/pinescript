version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo Installing dependencies for testing...
      - pip install -r requirements-webhook.txt pytest pytest-asyncio

  pre_build:
    commands:
      - echo Running unit tests...
      - PYTHONPATH=. pytest

  build:
    commands:
      - echo Preparing Elastic Beanstalk deployment files...
      - cp requirements-webhook.txt requirements.txt
      - 'echo "web: uvicorn main:app --host 0.0.0.0 --port 8080" > Procfile'
      - echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > .env
      - echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env
      - echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> .env

artifacts:
  files:
    - main.py
    - requirements.txt
    - Procfile
    - .env
