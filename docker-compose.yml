version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinescript-webhook
    networks:
      - app-network
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pinescript-tunnel
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel run
    depends_on:
      - webhook

